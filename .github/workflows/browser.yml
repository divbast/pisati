# The browser suite, on Linux, when dispatched: just browser, as it runs
# locally, in Chromium, Firefox and WebKit, against the linux baselines
# under test/browser/baselines. A screenshot with no baseline yet is
# written as one, and its test fails: the run keeps what it wrote as the
# artifact browser-baselines, for approval before it is committed, and a
# failed run's screenshots, diffs and Pisati's logs as browser-results.

name: browser

on:
  workflow_dispatch:

permissions: {}

# One browser suite at a time on each ref; a second waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The mise release jdx/mise-action installs. Renovate moves it.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.14

jobs:
  browser:
    name: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - run: just setup

      # The libraries the browsers need from the system, which only root
      # installs: Playwright runs apt-get through sudo.
      - name: Install the browsers' system libraries
        run: mise exec -- pnpm exec playwright install-deps chromium firefox webkit

      - run: just browser
        env:
          BROWSER_RESULTS: ${{ runner.temp }}/browser-results

      - name: Keep the baselines the run took
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-baselines
          path: test/browser/baselines/*-linux.png
          retention-days: 7
          # The action refuses a name the run already holds, as a re-run
          # may find it: this replaces the earlier upload instead.
          overwrite: true
          if-no-files-found: ignore

      - name: Keep the run's screenshots, diffs and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: ${{ runner.temp }}/browser-results
          retention-days: 7
          # The action refuses a name the run already holds, as a re-run
          # may find it: this replaces the earlier upload instead.
          overwrite: true
          if-no-files-found: ignore
