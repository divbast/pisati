# Lint, build, test and scan through divbast/ci's app-check.yml on every
# event, and on the daily slot. It runs this repository's own justfile
# recipes, which import the shared ones from divbast/ci at the commit
# pinned below. Nothing is published.

name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    #
    # The daily slot. It checks whether something outside this repository
    # has changed: the runner images, or the vulnerability database the scan
    # reads, so a new advisory against the pinned image shows within a day
    # rather than a week. 20:47 UTC is 07:47 in Melbourne under daylight
    # saving, 06:47 outside it: 20 minutes after the Lidarr image's slot, so
    # the runs do not share the organisation's 20 concurrent jobs.
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions: {}

# GitHub keeps one pending run per group, and a newer one replaces it. The
# event in the group stops a push run, frequent now that Renovate merges on
# its own, from replacing a pending slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    uses: divbast/ci/.github/workflows/app-check.yml@d4d169cdaf3debc8e1f3adf17358981eff3b71cc # v4.26.0
    with:
      # The DHI login, without which dhi.io answers nothing: the lint and
      # the build log in with it to read a Containerfile's Docker Hardened
      # Images. An app whose divbast/infra entry has no dhi = true reads
      # both empty, and ci skips the login.
      dhi-username: ${{ vars.DHI_USERNAME }}
      # The lint job checks out the whole history, so just lint's secret
      # scan reads every commit, as it does locally, and not only the one
      # commit a shallow checkout holds.
      full-history: true
    secrets:
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    permissions:
      contents: read
      attestations: read # verify the attestations of the images the Containerfile builds from
      packages: read # the scan asks GitHub whether the published image is absent or private
      security-events: write # code scanning, from main

  # The one check main's ruleset requires, so the job list can change without
  # touching the ruleset. GitHub counts a skipped required check as passing,
  # so this runs always and treats a skipped or cancelled job as a failure.
  required:
    name: required
    needs: [check]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done
