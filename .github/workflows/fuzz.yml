# Every fuzz target, when dispatched: just fuzz, as it runs locally, 10
# minutes for each target in turn. An input that fails a target is
# written under its package's testdata/fuzz; a failed run keeps them as
# the artifact fuzz-failures, to be committed with the fix.

name: fuzz

on:
  workflow_dispatch:

permissions: {}

# One fuzz run at a time on each ref; a second waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The mise release jdx/mise-action installs. Renovate moves it.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.12

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    # 15 targets at 10 minutes, and building each for fuzzing: more
    # targets need more time.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - run: just fuzz

      - name: Keep the inputs that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: |
            **/testdata/fuzz/**
            !test/acceptance/**
          retention-days: 7
          if-no-files-found: ignore
