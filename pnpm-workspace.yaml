# How pnpm installs the front end's packages. There is one package, the
# repository's root: this file holds pnpm's settings alone.

# A release is installed only once it is 7 days old, which gives a bad one
# time to be found and pulled first. Set here, the rule is strict: when no
# release in range is old enough, the install fails rather than take a
# newer one.
minimumReleaseAge: 10080

# No package's install script runs unless it is allowed here, and an
# install that meets one nobody has ruled on fails. None of the packages
# needs one: each native binary comes prebuilt, as an optional package for
# its platform.
strictDepBuilds: true
allowBuilds: {}
