# sqlc generates internal/store/storedb from the queries, checked against
# the schema the goose migrations build; it ignores their Down sections.
# Regenerate with `go tool -modfile=tools/go.mod sqlc generate`, and commit
# what it writes.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: storedb
        out: internal/store/storedb
